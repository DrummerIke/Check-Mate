<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BORK Pieces Preview</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    body { margin: 0; padding: 32px; background: #171310; color: #f2e8dc; font-family: Inter, system-ui, sans-serif; }
    h1, h2 { margin: 0 0 16px; letter-spacing: .06em; text-transform: uppercase; }
    .preview-grid { display: grid; gap: 24px; max-width: 980px; margin: 0 auto; }
    .preview-row { display: flex; flex-wrap: wrap; gap: 14px; padding: 18px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; }
    .preview-row.dark { background: #241f1b; }
    .preview-row.light { background: #d8c5ad; }
    .preview-cell { display: grid; place-items: center; border-radius: 16px; background: rgba(255,255,255,.06); }
    .preview-board { display: grid; grid-template-columns: repeat(6, 72px); width: max-content; overflow: hidden; border-radius: 18px; border: 1px solid rgba(255,255,255,.14); }
    .preview-square { width: 72px; height: 72px; display: grid; place-items: center; }
    .preview-square.light { background: #c8ad8d; }
    .preview-square.dark { background: #5d392a; }
  </style>
</head>
<body class="bork-pieces">
  <main class="preview-grid">
    <h1>BORK SVG chess pieces</h1>
    <section><h2>Белые на тёмном фоне</h2><div class="preview-row dark" id="whiteRow"></div></section>
    <section><h2>Чёрные на светлом фоне</h2><div class="preview-row light" id="blackRow"></div></section>
    <section><h2>Размеры 32 / 48 / 64 / 96 px</h2><div class="preview-row dark" id="sizeRow"></div></section>
    <section><h2>Шахматные клетки</h2><div class="preview-board" id="boardRow"></div></section>
  </main>
  <script type="module">
    import { renderPiece } from './pieces.js';
    const types = ['k', 'q', 'r', 'b', 'n', 'p'];
    const names = { k: 'Король', q: 'Ферзь', r: 'Ладья', b: 'Слон', n: 'Конь', p: 'Пешка' };
    function cell(html, size = 72) {
      return `<div class="preview-cell" title="${size}px" style="width:${size}px;height:${size}px">${html}</div>`;
    }
    whiteRow.innerHTML = types.map(type => cell(renderPiece({ color: 'w', type }))).join('');
    blackRow.innerHTML = types.map(type => cell(renderPiece({ color: 'b', type }))).join('');
    sizeRow.innerHTML = [32, 48, 64, 96].map(size => cell(renderPiece({ color: 'w', type: 'n' }), size)).join('');
    boardRow.innerHTML = types.map((type, index) => `<div class="preview-square ${index % 2 ? 'dark' : 'light'}" aria-label="${names[type]}">${renderPiece({ color: index % 2 ? 'b' : 'w', type })}</div>`).join('');
  </script>
</body>
</html>
